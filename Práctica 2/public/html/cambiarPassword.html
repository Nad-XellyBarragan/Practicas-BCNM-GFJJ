<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña</title>
    <!-- Usamos tu CSS estándar para que el diseño sea idéntico -->
    <link rel="stylesheet" href="../css/formStyles.css" type="text/css" />
</head>
<body>
    <div class="container">
        <h2>Establecer Nueva Contraseña</h2>
        
        <form id="formCambiarPass" novalidate>
            <p style="margin-bottom: 20px; font-size: 0.9em; color: #555; text-align: center;">
                Por favor, ingresa tu nueva contraseña y confírmala para actualizar tu cuenta.
            </p>

            <!-- Campo: Nueva Contraseña -->
            <label for="nuevaPass">Nueva Contraseña:</label>
            <input type="password" id="nuevaPass" name="nuevaPass" 
                   placeholder="Mínimo 6 caracteres" pattern="^[a-zA-Z0-9]{6,13}$" 
                    required>
            <span class="mensaje" id="error-nuevaPass"></span>
            
            <!-- Campo: Confirmar Contraseña -->
            <label for="confPass">Confirmar Nueva Contraseña:</label>
            <input type="password" id="confPass" name="confPass" 
                   placeholder="Repite tu contraseña" required>
            <span class="mensaje" id="error-confPass"></span>

            <div class="btnContainer">
                <!-- Botón para procesar el cambio -->
                <button class="submit" type="submit" id="btnConfirmar">Confirmar Cambio</button>
                </a>
            </div>
        </form>
    </div>

    <!-- Modal para avisos -->
    <div id="modal" class="modal-overlay" style="display: none;">
       <div class="modal-content">
          <h2 id="modalTitle"></h2>    
          <p id="modalMessage"></p>
          <button id="closeModal">Aceptar</button>
       </div>
    </div>

    <!-- Script específico para esta página -->
    <script src="../js/validateFormCo.js"></script>
</body>
</html>
